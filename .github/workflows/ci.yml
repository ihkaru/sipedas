name: Publish Backend to Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: FTP Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 🚀 Publish Livewire & Filament Assets
        run: |
          php artisan livewire:publish --assets --no-interaction || true
          php artisan filament:upgrade || true

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Build Vite Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 🚀 Sync Backend (admin.dvlp.asia)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_DVLP }}
          username: ${{ secrets.FTP_USERNAME_ADMIN }}
          password: ${{ secrets.FTP_PASSWORD_ADMIN }}
          protocol: ftp
          port: 21
          server-dir: admin.dvlp.asia/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/node_modules/**
            **/storage/**
            **/vendor/**
            **/docker/**
            **/docker-compose*.yml
            **/dockerfile*
            **/tests/**
            **/appDataDir/**
            **/*.zip

      - name: 🌐 Sync Public Web Assets (public_html/admin.dvlp.asia)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER_DVLP }}
          username: ${{ secrets.FTP_USERNAME_ADMIN }}
          password: ${{ secrets.FTP_PASSWORD_ADMIN }}
          protocol: ftp
          port: 21
          local-dir: ./public/
          server-dir: public_html/admin.dvlp.asia/
          exclude: |
            **/index.php
            **/.htaccess
            **/hot
            **/storage
            **/SPPD_files/**


