memory_limit=1024M
max_execution_time=120
post_max_size=100M
upload_max_filesize=100M

[opcache]
opcache.enable=1
opcache.enable_cli=1

; ─── DEV MODE: Validasi file secara efisien di Docker ───────────────────────
; validate_timestamps=1 → PHP cek mtime file sebelum pakai opcode cache
; revalidate_freq=2     → cek setiap 2 detik (mencegah ribuan syscall stat per request)
opcache.validate_timestamps=1
opcache.revalidate_freq=2

opcache.memory_consumption=256
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=60000
opcache.save_comments=1
opcache.fast_shutdown=1

; Tidak pakai JIT di dev (JIT mempersulit debugging)
opcache.jit=disable
opcache.jit_buffer_size=0

; FrankenPHP/Worker specific
opcache.file_update_protection=0
