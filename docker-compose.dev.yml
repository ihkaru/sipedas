# Project name eksplisit — mencegah Docker Compose menggunakan hash path Windows
name: sikendis

services:
    # Laravel App with FrankenPHP + Octane (--watch --poll)
    app:
        build:
            context: .
            target: dev
        container_name: sikendis-app-run
        restart: unless-stopped
        ports:
            - "8200:8000"
        volumes:
            - ./:/app:cached
            # Named volume untuk vendor PHP agar I/O native Linux cepat di container
            - dev_vendor:/app/vendor
            # Mount dev OPcache config (validate_timestamps=1) agar perubahan PHP langsung terdeteksi
            - ./docker/php/conf.d/opcache.dev.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
            - ./docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
        command: ["php", "artisan", "octane:start", "--server=frankenphp", "--host=0.0.0.0", "--port=8000", "--admin-port=2019", "--watch", "--poll"]
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        env_file:
            - .env.docker
        environment:
            XDG_CONFIG_HOME: /app/.config
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - sikendis_network

    # Vite HMR Dev Server — sepenuhnya di dalam Docker
    # Menggunakan named volume untuk node_modules agar binary Linux-native
    # tidak bentrok dengan node_modules Windows di host.
    vite:
        image: node:20-alpine
        container_name: sikendis-vite
        working_dir: /app
        restart: unless-stopped
        ports:
            - "5173:5173"
        volumes:
            - ./:/app:cached
            # Named volume untuk node_modules — terisolasi dari host Windows.
            - vite_node_modules:/app/node_modules
        # Fast startup: npm install hanya jika belum terpasang
        command: sh -c "if [ ! -d node_modules/vite ]; then npm install --prefer-offline; fi && npm run dev"
        networks:
            - sikendis_network

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: sikendis-db
        restart: unless-stopped
        ports:
            - "3309:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        env_file:
            - .env.docker
        networks:
            - sikendis_network

    # Redis Cache
    redis:
        image: redis:alpine
        container_name: sikendis-redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        env_file:
            - .env.docker
        networks:
            - sikendis_network

    # phpMyAdmin
    phpmyadmin:
        image: phpmyadmin
        container_name: sikendis-pma
        restart: unless-stopped
        ports:
            - "8281:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            UPLOAD_LIMIT: 200M
        depends_on:
            - db
        networks:
            - sikendis_network

volumes:
    mysql_data:
    redis_data:
    vite_node_modules:   # Named volume untuk node_modules Linux-native Vite
    dev_vendor:

networks:
    sikendis_network:
        driver: bridge
